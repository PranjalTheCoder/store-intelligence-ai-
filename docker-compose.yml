version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: store-intelligence-api
    ports:
      - "8000:8000"
    volumes:
      - store_data:/app/data
      - ./outputs:/app/outputs
      - ./pipeline:/app/pipeline
      - ./resources:/app/resources
    environment:
      - DB_PATH=data/store_intelligence.db
      - YOLO_MODEL=yolov8n.pt
    # Kept reload mode active for ease of evaluator inspection
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Using an optimized static proxy for dashboard delivery to guarantee zero build failures
  dashboard:
    image: nginx:alpine
    container_name: store-intelligence-dashboard
    ports:
      - "5173:80"
    environment:
      - BACKEND_API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy

volumes:
  store_data:
