version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: store-intelligence-api
    ports:
      - "8000:8000"
    volumes:
      # Only mount directories that need to persist written data.
      # Code/resources are already safely inside the image via COPY . .
      - ./data:/app/data
      - ./outputs:/app/outputs
    environment:
      - DB_PATH=data/store_intelligence.db
      - YOLO_MODEL=yolov8n.pt
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        # Must point to localhost because Vite runs in the reviewer's browser!
        - VITE_API_URL=http://localhost:8000
    container_name: store-intelligence-dashboard
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
