server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend container
    location /stores/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }
    location /health {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }
    location /events/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }
}
